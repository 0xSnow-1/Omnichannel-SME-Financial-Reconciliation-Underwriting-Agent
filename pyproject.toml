[project]
name = "sme-underwriting-copilot"
version = "0.1.0"
description = "AI back-office system: turns scattered small-business financial proof into a verified, explained credit file."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-aws>=0.2.0",
    "boto3>=1.35.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "streamlit>=1.40.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "black>=24.0.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
pythonpath = ["backend/src"]
addopts = "--cov=sme_copilot --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sme_copilot"]
mypy_path = "backend/src"