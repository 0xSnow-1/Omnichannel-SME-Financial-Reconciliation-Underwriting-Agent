services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sme
      POSTGRES_PASSWORD: sme
      POSTGRES_DB: sme_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sme -d sme_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://sme:sme@db:5432/sme_copilot
      KYC_STUB_RESULT: pass
      LLM_PROVIDER: bedrock-haiku
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      MAX_UPLOAD_SIZE_MB: 25
      MAX_FILES_PER_APP: 5
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata: